[package]
name = "futures-timer"
version = "3.0.4"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/async-rs/futures-timer"
homepage = "https://github.com/async-rs/futures-timer"
documentation = "https://docs.rs/futures-timer"
description = "snare drop-in shim for futures-timer: one timer thread per snare sim instead of per process"
publish = false

[dependencies]
snare-interpose = { version = "3.5.0", path = "../../crates/snare-interpose" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
send_wrapper = { version = "0.6.0", optional = true }

[dev-dependencies]
async-std = { version = "1.13", features = ["attributes"] }
futures = "0.3.1"
futures-lite = "2"

[target.'cfg(snare)'.dev-dependencies.snare]
path = "../../crates/snare"

[features]
wasm-bindgen = [
    "gloo-timers",
    "send_wrapper"
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(assert_timer_heap_consistent)', 'cfg(snare)'] }

[patch.crates-io]
futures-timer = { path = "." }
