[package]
edition = "2021"
rust-version = "1.88"
name = "async-global-executor"
version = "2.4.1"
authors = ["Marc-Antoine Perennou <Marc-Antoine@Perennou.com>"]
description = "snare drop-in shim for async-global-executor: one global executor and thread pool per snare sim instead of per process"
publish = false
homepage = "https://github.com/Keruspe/async-global-executor"
documentation = "https://docs.rs/async-global-executor"
keywords = [
    "async",
    "await",
    "future",
    "executor",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Keruspe/async-global-executor"

[lib]
doctest = false

[dependencies.snare-interpose]
version = "3.1.0"
path = "../../crates/snare-interpose"

[dependencies.async-channel]
version = "^2.1.1"

[dependencies.async-executor]
version = "^1.8"

[dependencies.async-io]
version = "^2.2.1"
optional = true

[dependencies.async-lock]
version = "^3.2"

[dependencies.blocking]
version = "^1.5"

[dependencies.futures-lite]
version = "^2.0"

[dependencies.once_cell]
version = "^1.4"

[dependencies.tokio-crate]
version = "^1.0"
features = [
    "rt",
    "rt-multi-thread",
]
optional = true
default-features = false
package = "tokio"

[dependencies.tokio02-crate]
version = "^0.2"
features = ["rt-core"]
optional = true
default-features = false
package = "tokio"

[dependencies.tokio03-crate]
version = "^0.3.4"
features = [
    "rt",
    "rt-multi-thread",
]
optional = true
default-features = false
package = "tokio"

[features]
default = ["async-io"]
tokio = ["tokio-crate"]
tokio02 = ["tokio02-crate"]
tokio03 = ["tokio03-crate"]
