[package]
edition = "2018"
rust-version = "1.88"
name = "smol"
version = "2.0.2"
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
build = false
autobins = false
autoexamples = false
description = "snare drop-in shim for smol: one global executor and set of smol-N threads per snare sim instead of per process"
publish = false
keywords = [
    "async",
    "await",
    "future",
    "io",
    "networking",
]
categories = [
    "asynchronous",
    "concurrency",
    "network-programming",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smol-rs/smol"

[lib]
name = "smol"
path = "src/lib.rs"
doctest = false

[dependencies.async-channel]
version = "2.0.0"

[dependencies.async-executor]
version = "1.5.0"

[dependencies.async-fs]
version = "2.0.0"

[dependencies.async-io]
version = "2.1.0"

[dependencies.async-lock]
version = "3.0.0"

[dependencies.async-net]
version = "2.0.0"

[dependencies.blocking]
version = "1.3.0"

[dependencies.snare-interpose]
version = "3.1.1"
path = "../../crates/snare-interpose"

[dependencies.futures-lite]
version = "2.0.0"

[target.'cfg(not(target_os = "espidf"))'.dependencies.async-process]
version = "2.0.0"

[target.'cfg(snare)'.dev-dependencies.snare]
path = "../../crates/snare"

[patch.crates-io]
async-io = { path = "../async-io" }
blocking = { path = "../blocking" }
smol = { path = "." }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(snare)"] }
