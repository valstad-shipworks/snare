[package]
name = "xsk-rs"
version = "0.8.0"
edition = "2021"
description = "snare drop-in shim for xsk-rs: AF_XDP frame TX/RX rerouted through libc send/recv so an in-process interposer can observe and redirect them"
license = "MIT"
publish = false

[lib]
name = "xsk_rs"
path = "src/lib.rs"

[dependencies]
bitflags = "2.13.2"
libc = "0.2.189"
snare-interpose = { version = "2.0.0", path = "../../crates/snare-interpose" }
