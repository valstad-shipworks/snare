[package]
edition = "2021"
rust-version = "1.88"
name = "blocking"
version = "1.7.0"
build = false
exclude = ["/.*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "snare drop-in shim for blocking: one thread pool per snare sim instead of per process"
publish = false
keywords = [
    "async",
    "file",
    "stdio",
    "stdin",
    "process",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/smol-rs/blocking"

[lib]
name = "blocking"
path = "src/lib.rs"
doctest = false

[dependencies.snare-interpose]
version = "3.1.0"
path = "../../crates/snare-interpose"

[dependencies.async-channel]
version = "2.0.0"

[dependencies.async-task]
version = "4.4.0"

[dependencies.futures-io]
version = "0.3.28"
features = ["std"]
default-features = false

[dependencies.futures-lite]
version = "2.0.0"
default-features = false

[dependencies.piper]
version = "0.2.0"

[dependencies.tracing]
version = "0.1.37"
optional = true
default-features = false
