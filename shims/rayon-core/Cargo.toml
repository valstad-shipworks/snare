[package]
edition = "2021"
rust-version = "1.88"
name = "rayon-core"
version = "1.13.0"
build = "build.rs"
links = "rayon-core"
autolib = false
autobins = false
autoexamples = false
description = "snare drop-in shim for rayon-core: steal order seeded per registry inside a sim; with cfg(snare_parallel_rayon), one global pool per sim"
publish = false
documentation = "https://docs.rs/rayon-core/"
keywords = [
    "parallel",
    "thread",
    "concurrency",
    "join",
    "performance",
]
categories = ["concurrency"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rayon-rs/rayon"

[features]
web_spin_lock = ["dep:wasm_sync"]

[lib]
name = "rayon_core"
path = "src/lib.rs"
doctest = false

[dependencies.crossbeam-deque]
version = "0.8.1"

[dependencies.crossbeam-utils]
version = "0.8.0"

[dependencies.wasm_sync]
version = "0.1.0"
optional = true

[dev-dependencies.rand]
version = "0.9"

[dev-dependencies.rand_xorshift]
version = "0.4"

[dev-dependencies.scoped-tls]
version = "1.0"

[target."cfg(unix)".dev-dependencies.libc]
version = "0.2"

[target.'cfg(snare)'.dependencies.snare-interpose]
version = "3.1.0"
path = "../../crates/snare-interpose"

[target.'cfg(snare)'.dev-dependencies.snare]
path = "../../crates/snare"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(snare)", "cfg(snare_parallel_rayon)"] }
