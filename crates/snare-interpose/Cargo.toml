[package]
name = "snare-interpose"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Redirects a program's calls into the operating system to pluggable layers, per thread"

[dependencies]

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus", "Win32_Networking_WinSock"] }

[dev-dependencies]
libc = "0.2.189"
