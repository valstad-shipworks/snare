[package]
name = "cargo-snare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["cargo", "subcommand", "testing", "simulation"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]
description = "Cargo subcommand that runs a crate's #[cfg(snare)] tests under the snare interposer with the syscall shims patched in"

[[bin]]
name = "cargo-snare"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
toml_edit = "0.25.15"
