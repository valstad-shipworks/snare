[package]
name = "snare"
version = "2.0.0-alpha.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Ergonomic in-process network testing on top of snare-interpose: write the code under test against std, describe the peer with a tester builder"

[dependencies]
snare-interpose = { path = "../snare-interpose" }

[target.'cfg(unix)'.dependencies]
glob = "0.3.4"
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Networking_WinSock"] }

[target."cfg(windows)".dev-dependencies]
pcap = "2.5.0"
