[package]
name = "snare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["network", "testing", "simulation", "deterministic", "mock"]
categories = ["development-tools::testing", "simulation"]
readme = "../../README.md"
description = "Ergonomic in-process network testing on top of snare-interpose: write the code under test against std, describe the peer with a tester builder"

[dependencies]
snare-interpose = { version = "3.1.0", path = "../snare-interpose" }

[target.'cfg(unix)'.dependencies]
glob = "0.3.4"
libc = "0.2"

[target.'cfg(unix)'.dev-dependencies]
async-io = "2.6.0"
futures-lite = "2.6.1"
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
signal-hook = "0.4.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_System_Performance", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_Kernel"] }

[target."cfg(windows)".dev-dependencies]
mio = { version = "1", features = ["net", "os-poll", "os-ext"] }
pcap = "2.5.0"

[dev-dependencies]
criterion = "0.5"
crossbeam-utils = "0.8.23"
ctrlc = "3.5.2"
event-listener = "5.4.2"
rayon = "1.12.0"
spin_sleep = "1.3.3"
tokio = { version = "1.53.2", features = ["full"] }

[features]
# Builds Windows npcap tests, which link wpcap.lib from the npcap SDK.
hw-npcap = []

[package.metadata.docs.rs]
rustc-args = ["--cfg", "snare"]
rustdoc-args = ["--cfg", "snare"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(snare)"] }

[[bench]]
name = "hooked_calls"
harness = false
