[package]
name = "snare"
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bowan Foryt <bowan@valstad.com>"]
description = "Network communication testing library for rust"
repository = "https://github.com/valstad-shipworks/snare"
keywords = ["network", "testing", "mock"]
categories = ["development-tools::testing"]

[dependencies]
anymap2 = "0.13.0"
mio = { version = "1", optional = true, features = ["os-poll", "os-ext", "net"] }
parking_lot = "0.12.5"
event-listener = { version = "5.4.1", features = ["std"] }

[dev-dependencies]
bincode = "2.0.1"

[features]
default = []
mio-compat = ["mio"]
shim = []

[[test]]
name = "cyclic"
path = "tests/cyclic.rs"
required-features = ["shim"]

[[test]]
name = "packet_count"
path = "tests/packet_count.rs"
required-features = ["shim"]

[[test]]
name = "mio_compat"
path = "tests/mio_compat.rs"
required-features = ["shim", "mio-compat"]

[[test]]
name = "proper_response"
path = "tests/proper_response.rs"
required-features = ["shim"]

[[test]]
name = "thread_tracking"
path = "tests/thread_tracking.rs"
required-features = ["shim"]

[[test]]
name = "quiesce"
path = "tests/quiesce.rs"
required-features = ["shim", "mio-compat"]

[[test]]
name = "policy"
path = "tests/policy.rs"
required-features = ["shim", "mio-compat"]

# Parity test compiles against `snare::net` / `snare::thread` once with shim
# on (verifies the shim API matches std) and once with shim off (transparent
# re-export test).
[[test]]
name = "std_parity_shim"
path = "tests/std_parity_shim.rs"
required-features = ["shim"]
[[test]]
name = "std_parity_real"
path = "tests/std_parity_real.rs"
