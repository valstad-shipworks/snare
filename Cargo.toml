[package]
name = "snare"
version = "1.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bowan Foryt <bowan@valstad.com>"]
description = "Network communication testing library for rust"
repository = "https://github.com/valstad-shipworks/snare"
keywords = ["network", "testing", "mock"]
categories = ["development-tools::testing"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(snare_global)'] }

[dependencies]
anymap2 = "0.13.0"
ctrlc = { version = "3.5.2", optional = true }
# path for development; publishing needs a fast-talker release with the hidden "sim" feature, then drop path
fast-talker = { version = "0.1.0", path = "../fast-talker", default-features = false, optional = true }
mio = { version = "1", optional = true, features = ["os-poll", "os-ext", "net"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
bincode = "2.0.1"
flume = "0.12.0"
toml = "1.1.6"

[features]
default = []
mio-compat = ["mio", "fast-talker?/mio"]
shim = ["fast-talker?/sim", "fast-talker?/plan", "fast-talker?/options", "fast-talker?/sys-check", "fast-talker?/monitor"]
ctrlc-compat = ["dep:ctrlc"]
ctrlc-termination = ["ctrlc-compat", "ctrlc/termination"]
fast-talker-core = ["dep:fast-talker"]
fast-talker-plan = ["fast-talker-core", "fast-talker/plan"]
fast-talker-options = ["fast-talker-core", "fast-talker/options"]
fast-talker-sys-check = ["fast-talker-core", "fast-talker/sys-check"]
fast-talker-monitor = ["fast-talker-plan", "fast-talker-options", "fast-talker/monitor"]
fast-talker-serde = ["fast-talker-core", "fast-talker/serde", "dep:serde"]
fast-talker-pyo3 = ["fast-talker-options", "fast-talker/pyo3"]
fast-talker-compat = ["fast-talker-monitor", "fast-talker-sys-check"]

[[test]]
name = "cyclic"
path = "tests/cyclic.rs"
required-features = ["shim"]

[[test]]
name = "packet_count"
path = "tests/packet_count.rs"
required-features = ["shim"]

[[test]]
name = "mio_compat"
path = "tests/mio_compat.rs"
required-features = ["shim", "mio-compat"]

[[test]]
